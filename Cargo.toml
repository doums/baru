[package]
name = "baru"
version = "0.5.3"
description = "A simple system monitor for WM statusbar"
authors = ["pierre <dommerc.pierre@gmail.com>"]
edition = "2024"
links = "netlink,audio"
build = "build.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "tracing-log",
    "env-filter",
] }
tracing-appender = "0.2"
once_cell = "1.21"
chrono = "0.4"
regex = "1"
reqwest = {
  version = "0.13",
  default-features = false,
  features = ["http2", "charset", "native-tls", "blocking", "json"]
}
signal-hook = "0.4"

[build-dependencies]
cmake = "0.1"

[profile.release]
codegen-units = 1
strip = true
opt-level = "s"
lto = true
